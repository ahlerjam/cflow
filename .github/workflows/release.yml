name: Release

on:
  push:
    branches: [main]
    paths: [plugins/**]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Tag and release new plugin versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            [ -f "$manifest" ] || continue
            name=$(jq -r .name "$manifest")
            version=$(jq -r '.version // empty' "$manifest")
            [ -n "$version" ] || continue
            tag="$name--v$version"
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null && continue
            prev=$(git tag -l "$name--v*" --sort=-v:refname | head -n 1)
            claude plugin tag "plugins/$name" -m "$name %s" --push
            gh release create "$tag" --verify-tag --title "$name $version" \
              --generate-notes ${prev:+--notes-start-tag "$prev"}
          done
