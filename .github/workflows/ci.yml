name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          for dir in plugins/*/; do
            [ -f "$dir/.claude-plugin/plugin.json" ] || continue
            claude plugin validate --strict "$dir"
          done

      - name: Changed plugins have a new version
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          fail=0
          for name in $(git diff --name-only "$BASE"...HEAD -- plugins/ | cut -d/ -f2 | sort -u); do
            manifest="plugins/$name/.claude-plugin/plugin.json"
            [ -f "$manifest" ] || continue
            new=$(jq -r '.version // empty' "$manifest")
            old=$(git show "$BASE:$manifest" 2>/dev/null | jq -r '.version // empty' || true)
            if [ -z "$new" ]; then
              echo "::error file=$manifest::$name has no version"
              fail=1
            elif [ "$new" = "$old" ]; then
              echo "::error file=$manifest::$name changed but is still at $new, users would not get the update"
              fail=1
            fi
          done
          exit $fail
